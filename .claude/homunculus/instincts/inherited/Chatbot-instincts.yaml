# Chatbot Workflow Move Or Refactor Shared Ui Components

## Action

Follow the move-or-refactor-shared-ui-components workflow:
1. Move component file(s) from app-specific location to packages/ui/src/components/
2. Update or add supporting files (e.g., hooks, icon lists) in packages/ui/
3. Update all imports/usages in apps/builder and other consumers to use the new shared location
4. Update or add package.json and tsconfig files as needed
5. Remove old/duplicate component files from app-specific locations

## Evidence

- Workflow detected from commit patterns
- Frequency: ~3x per month
- Files: apps/builder/src/components/*.tsx, apps/builder/src/features/**/components/*.tsx, packages/ui/src/components/*.tsx

